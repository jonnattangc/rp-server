services:
  nginx:
    container_name: reverse-proxy
    image: reverse-proxy:1.1.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - "./html:/var/www/html"
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "./nginx/mime.types:/etc/nginx/mime.types"
      - "./sites-enabled/default:/etc/nginx/sites-enabled/default"
      - "./conf/jonna_cl.conf:/etc/nginx/conf.d/jonna.cl.conf"
      - "./conf/bcp_cl.conf:/etc/nginx/conf.d/bcp.cl.conf"
      - "./conf/jonnattan_cl.conf:/etc/nginx/conf.d/jonnattan.cl.conf"
      - "./conf/jonnatech_cl.conf:/etc/nginx/conf.d/jonnatech.cl.conf"
      - "./conf/au_com.conf:/etc/nginx/conf.d/au.com.conf"
      - "./logs:/var/log/nginx"
      - "./ssl:/etc/ssl"
    environment:
      - TZ:UTC-4
    ports:
      - "5555:80"
