server {
    listen              80;
    listen              [::]:80;
    server_name         www.jonnatech.cl;

    error_log           /var/log/nginx/jonnatech.cl.error.log;
    access_log          /var/log/nginx/jonnatech.cl.access.log detail; 

    error_page          500 502 503 504 /error.html;      
    error_page          404 /no_found.html;

    root                /var/www/html;
    index               index.html index.htm index.nginx-debian.html;

    location = /error.html {
        root /var/www/html;
        internal;
    }

    location = /no_found.html {
        root /var/www/html;
        internal;
    }

    location = /favicon.ico {
        root /var/www/html/jonnattan;
    }

    location / {
      proxy_pass_request_headers    on;
      proxy_pass                    http://hp.jonnattan:4001/;
      proxy_set_header              Host $host;
      proxy_set_header              X-Real-IP  $remote_addr;
      proxy_set_header              X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-Proto https;
      proxy_set_header              X-Forwarded-Host $host;
      proxy_cache_bypass            $http_secret_header;
      add_header                    X-Cache-Status $upstream_cache_status;
    }
    
    location /sms/admin/events/ {
        proxy_pass                 http://hp.jonnattan:8080/admin/events/;

        proxy_http_version         1.1;
        proxy_set_header           Connection "";

        proxy_buffering            off;
        proxy_cache                off;
        gzip                       off;

        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;

        proxy_pass_request_headers on;
        proxy_set_header           Host $host;
        proxy_set_header           X-Real-IP $remote_addr;
        proxy_set_header           X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto https;
        proxy_set_header           X-Forwarded-Host $host;
    }

    location /sms/ {
      proxy_pass_request_headers    on;
      proxy_pass                    http://hp.jonnattan:8080/;
      proxy_set_header              Host $host;
      proxy_set_header              X-Real-IP  $remote_addr;
      proxy_set_header              X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-Proto https;
      proxy_set_header              X-Forwarded-Host $host;
      proxy_cache_bypass            $http_secret_header;
      add_header                    X-Cache-Status $upstream_cache_status;
    }

    location /easydocu/ {
      proxy_pass_request_headers    on;
      proxy_pass                    http://lenovo.jonnattan:8081/;
      proxy_set_header              Host $host;
      proxy_set_header              X-Real-IP  $remote_addr;
      proxy_set_header              X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-Proto https;
      proxy_set_header              X-Forwarded-Host $host;
      proxy_cache_bypass            $http_secret_header;
      add_header                    X-Cache-Status $upstream_cache_status;
    }

    location /happytreasury/ {
      proxy_pass_request_headers    on;
      proxy_pass                    http://mgkt.jonnattan:8082/;
      proxy_set_header              Host $host;
      proxy_set_header              X-Real-IP  $remote_addr;
      proxy_set_header              X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-Proto https;
      proxy_set_header              X-Forwarded-Host $host;
      proxy_cache_bypass            $http_secret_header;
      add_header                    X-Cache-Status $upstream_cache_status;
    }

}

server {
    listen                  80;
    listen                  [::]:80;
    server_name             api.jonnatech.cl;

    error_log               /var/log/nginx/api_jonnatech_cl.error.log;
    access_log              /var/log/nginx/api_jonnatech_cl.access.log detail; 

    error_page 500 502 503 504 /error.html;      
    error_page 404 /no_found.html;

    root                    /var/www/html;
    index                   index.html index.htm index.nginx-debian.html;

    location = /error.html {
        root /var/www/html;
        internal;
    }

    location = /no_found.html {
        root /var/www/html;
        internal;
    }

    location = /favicon.ico {
        root /var/www/html/jonnattan;
    }

    location ^~ / {
      proxy_pass_request_headers  on;
      proxy_pass                  http://hp.jonnattan:4000;
      proxy_set_header            Host $host;
      proxy_set_header            X-Real-IP $remote_addr;
      proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header            X-Forwarded-Proto https;
      proxy_set_header            X-Forwarded-Host $host;
      client_max_body_size        8M;
    }

    location ^~ /sms {
      proxy_pass_request_headers  on;
      proxy_pass                  http://hp.jonnattan:8081/sms/api;
      proxy_set_header            Host $host;
      proxy_set_header            X-Real-IP $remote_addr;
      proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header            X-Forwarded-Proto https;
      proxy_set_header            X-Forwarded-Host $host;
      client_max_body_size        8M;
    }

    location ^~ /easydocu {
      proxy_pass_request_headers  on;
      proxy_pass                  http://lenovo.jonnattan:8082/easydocu;
      proxy_set_header            Host $host;
      proxy_set_header            X-Real-IP $remote_addr;
      proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header            X-Forwarded-Proto https;
      proxy_set_header            X-Forwarded-Host $host;
      client_max_body_size        8M;
    }

    location ^~ /notification {
      proxy_pass_request_headers  on;
      proxy_pass                  http://mgkt.jonnattan:8060/notification;
      proxy_set_header            Host $host;
      proxy_set_header            X-Real-IP $remote_addr;
      proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header            X-Forwarded-Proto https;
      proxy_set_header            X-Forwarded-Host $host;
      client_max_body_size        8M;
    }
    
}


