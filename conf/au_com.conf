server {
    listen              80;
    listen              [::]:80;
    server_name         www.americaunida2027.com;

    error_log           /var/log/nginx/au_com.error.log;
    access_log          /var/log/nginx/au_com.access.log detail; 

    error_page          500 502 503 504 /error.html;      
    error_page          404 /no_found.html;

    root                /var/www/html;
    index               index.html index.htm index.nginx-debian.html;

    location = /error.html {
        root /var/www/html;
        internal;
    }

    location = /no_found.html {
        root /var/www/html;
        internal;
    }

    location = /favicon.ico {
        root /var/www/html/jonnattan;
    }

    location / {
      proxy_pass_request_headers    on;
      proxy_pass                    http://192.168.1.72:8000;
      proxy_set_header              Host $host;
      proxy_set_header              X-Real-IP  $remote_addr;
      proxy_set_header              X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-Proto https;
      proxy_set_header              X-Forwarded-Host $host;
      proxy_cache_bypass            $http_secret_header;
      add_header                    X-Cache-Status $upstream_cache_status;
    }

}

server {
    listen                  80;
    listen                  [::]:80;
    server_name             api.americaunida2027.com;

    error_log               /var/log/nginx/api_au_com.error.log;
    access_log              /var/log/nginx/api_au_com.log detail; 

    error_page 500 502 503 504 /error.html;      
    error_page 404 /no_found.html;

    root                    /var/www/html;
    index                   index.html index.htm index.nginx-debian.html;

    location = /error.html {
        root /var/www/html;
        internal;
    }

    location = /no_found.html {
        root /var/www/html;
        internal;
    }

    location = /favicon.ico {
        root /var/www/html/jonnattan;
    }

    location ^~ / {
      proxy_pass_request_headers  on;
      proxy_pass                  http://192.168.1.88:4000;
      proxy_set_header            Host $host;
      proxy_set_header            X-Real-IP $remote_addr;
      proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header            X-Forwarded-Proto https;
      proxy_set_header            X-Forwarded-Host $host;
      client_max_body_size        8M;
    }
    
}


