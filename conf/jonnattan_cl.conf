server {
    listen              80;
    listen              [::]:80;
    server_name         www.jonnattan.cl;
    
    error_log           /var/log/nginx/jonnattan_cl_error.log;
    access_log          /var/log/nginx/jonnattan_cl_access.log detail;    

    root                /var/www/html;
    index               index.html index.htm index.nginx-debian.html;

    error_page          500 502 503 504 /error.html;  
    error_page          404 /no_found.html; 

    location = /error.html {
          root /var/www/html;
          internal;
    }

    location = /no_found.html {
      root /var/www/html;
      internal;
    }

    location = /favicon.ico {
      root /var/www/html/jonnattan;
    }

    location ^~ /sitio_mtto.png {
      root /var/www/html;
      index /sitio_mtto.png;
      proxy_cache_bypass $http_secret_header;
      add_header X-Cache-Status $upstream_cache_status;
    }

    ######################  WEB ################################

    location  ^~ / {
      proxy_pass_request_headers    on;
      proxy_pass                    http://hp.jonnattan:3000/;
      proxy_http_version            1.1;
      proxy_set_header              Upgrade $http_upgrade;
      proxy_set_header              Connection "upgrade";
      proxy_set_header              Host $host;
      proxy_set_header              X-Real-IP  $remote_addr;
      proxy_set_header              X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-Proto https;
      proxy_set_header              X-Forwarded-Host $host;
      proxy_cache_bypass            $http_secret_header;
      add_header                    X-Cache-Status $upstream_cache_status;
    }

    location /ws {
      proxy_pass                  http://mini.jonnattan:8055;
      proxy_http_version          1.1;
      proxy_set_header            Upgrade $http_upgrade;
      proxy_set_header            Connection "upgrade";
      proxy_set_header            Host $host;
      proxy_cache_bypass          $http_upgrade;
      proxy_read_timeout          86400; # O un valor adecuado para WebSockets
    }

    location /privacity {
      proxy_pass_request_headers  on;
      proxy_pass                  http://mini.jonnattan:8085/privacity;
    }

    location /terms {
      proxy_pass_request_headers  on;
      proxy_pass                  http://mini.jonnattan:8085/terms;
    }
}

server {
    listen              80;
    listen              [::]:80;
    server_name         docs.jonnattan.cl;

    error_log           /var/log/nginx/docs_jonnattan.cl.error.log;
    access_log          /var/log/nginx/docs_jonnattan.cl.access.log detail; 

    error_page          500 502 503 504 /error.html;      
    error_page          404 /no_found.html;

    root                /var/www/html;
    index               index.html index.htm index.nginx-debian.html;

    location = /error.html {
        root /var/www/html;
        internal;
    }

    location = /no_found.html {
        root /var/www/html;
        internal;
    }

    location = /favicon.ico {
        root /var/www/html/jonnattan;
    }

    location = /apijonna.json {
      proxy_pass_request_headers        on;
      proxy_pass                        http://hp.jonnattan:8085;
    }
}

server {
    listen              80;
    listen              [::]:80;
    server_name         api.jonnattan.cl;

    error_log           /var/log/nginx/api_jonnattan_cl.error.log;
    access_log          /var/log/nginx/api_jonnattan_cl.access.log detail; 

    location /status$ {
      proxy_pass_request_headers        on;
      proxy_pass                        http://mini.jonnattan:8085/status;
    }

    location /email {
      proxy_pass_request_headers          on;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  https;
      proxy_set_header X-Forwarded-Host   $host;
      proxy_pass                          http://mini.jonnattan:8070/email;
    }

      location /v2/email {
        proxy_pass_request_headers          on;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_pass                          http://mgkt.jonnattan:8070/email;
      }

      location /llm {
        proxy_pass_request_headers          on;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_pass                          http://mini.jonnattan:8065/llm;
      }
      
      location /docs {
        proxy_pass_request_headers          on;
        proxy_pass                          http://mini.jonnattan:8095/docs;
        proxy_set_header                    Host $host;
        proxy_set_header                    X-Real-IP $remote_addr;
        proxy_set_header                    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header                    X-Forwarded-Proto https;
        proxy_set_header                    X-Forwarded-Host $host;
        client_max_body_size                8M;
      }

      location /v2/docs {
        proxy_pass_request_headers          on;
        proxy_pass                          http://mgkt.jonnattan:8095/docs;
        proxy_set_header                    Host $host;
        proxy_set_header                    X-Real-IP $remote_addr;
        proxy_set_header                    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header                    X-Forwarded-Proto https;
        proxy_set_header                    X-Forwarded-Host $host;
        client_max_body_size                8M;
      }

      location /geo {
        proxy_pass_request_headers on;
        proxy_pass  http://mini.jonnattan:8075/geo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 8M;
      }

      location /v2/geo {
        proxy_pass_request_headers          on;
        proxy_pass                          http://mgkt.jonnattan:8075/geo;
        proxy_set_header                    Host $host;
        proxy_set_header                    X-Real-IP $remote_addr;
        proxy_set_header                    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header                    X-Forwarded-Proto https;
        proxy_set_header                    X-Forwarded-Host $host;
        client_max_body_size                8M;
      }
    

      location /emulator {
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 65s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_pass http://mini.jonnattan:8050/emulator;
      }

      location /scraper {
        proxy_pass_request_headers  on;
        proxy_pass  http://mgkt.jonnattan:8090/scraper;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 8M;
      }

      location /notification {
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://mini.jonnattan:8060/notification;
      }

      location ^~ / {
        proxy_pass_request_headers        on;
        proxy_pass                        http://hp.jonnattan:8085/;
        proxy_set_header                  Host $host;
        proxy_set_header                  X-Real-IP $remote_addr;
        proxy_set_header                  X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header                  X-Forwarded-Proto https;
        proxy_set_header                  X-Forwarded-Host $host;
        client_max_body_size              8M;
    }


}

